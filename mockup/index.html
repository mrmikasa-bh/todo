<title>To-Do phone mock-ups</title>
<style>
  body { margin: 0; padding: 32px 16px; background: #dfe3ea; font-family: system-ui, sans-serif;
         display: flex; flex-wrap: wrap; gap: 48px; justify-content: center; align-items: flex-start; }
  figure { margin: 0; text-align: center; }
  figcaption { margin-top: 14px; color: #333; font-size: .95rem; }
  .phone { position: relative; background: #111; box-shadow: 0 12px 30px rgba(0,0,0,.35); }
  .phone img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: top; background: #fff; }
  /* iPhone 16: 393x852, rounded corners, dynamic island */
  .iphone { width: 393px; height: 852px; padding: 12px; border-radius: 62px; box-sizing: content-box; }
  .iphone img { border-radius: 50px; }
  .iphone::before { content: ""; position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
                    width: 112px; height: 32px; background: #000; border-radius: 20px; z-index: 2; }
  /* Galaxy S25: 360x780, tighter corners, punch-hole camera */
  .galaxy { width: 360px; height: 780px; padding: 9px; border-radius: 42px; box-sizing: content-box; background: #1b1b1f; }
  .galaxy img { border-radius: 34px; }
  .galaxy::before { content: ""; position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
                    width: 14px; height: 14px; background: #000; border-radius: 50%; z-index: 2; }
</style>
