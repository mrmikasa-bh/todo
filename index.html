<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-Do</title>
<style>
  :root {
    --bg: #ffffff; --fg: #111111; --muted: #666666; --border: #dddddd;
    --input-bg: #ffffff; --btn-bg: #efefef; --tag-bg: #e8eefc; --tag-fg: #223344;
    --danger: #cc0000; --header-bg: #d32f2f;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1c1c1e; --fg: #f2f2f2; --muted: #a0a0a5; --border: #3a3a3c;
      --input-bg: #2c2c2e; --btn-bg: #3a3a3c; --tag-bg: #2f3b5c; --tag-fg: #d6e0ff;
      --danger: #ff6b6b; --header-bg: #b71c1c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1c1c1e; --fg: #f2f2f2; --muted: #a0a0a5; --border: #3a3a3c;
    --input-bg: #2c2c2e; --btn-bg: #3a3a3c; --tag-bg: #2f3b5c; --tag-fg: #d6e0ff;
    --danger: #ff6b6b; --header-bg: #b71c1c;
    color-scheme: dark;
  }

  body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px;
         background: var(--bg); color: var(--fg); }
  /* Title stays centered; the theme icon sits at the right end of the header */
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
           padding: 12px; margin-bottom: 16px; border-radius: 8px;
           background: var(--header-bg); color: #ffffff; }
  header h1 { margin: 0; text-align: center; }
  header #count { color: #ffffff; }
  header .icon-btn { justify-self: end; background: rgba(255,255,255,.2); color: #ffffff;
                     border-color: rgba(255,255,255,.5); }
  .row { display: flex; gap: 8px; margin-bottom: 8px; }
  input[type=text], input[type=date], select {
    padding: 8px; font-size: 1rem; min-width: 0;
    background: var(--input-bg); color: var(--fg); border: 1px solid var(--border); border-radius: 4px;
  }
  input[type=text] { flex: 1; }
  #category { flex: 1; }
  button { padding: 8px 12px; font-size: 1rem; cursor: pointer;
           background: var(--btn-bg); color: var(--fg); border: 1px solid var(--border); border-radius: 4px; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--border); }
  .main { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .meta { font-size: .85rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
  .cat { background: var(--tag-bg); color: var(--tag-fg); border-radius: 10px; padding: 0 8px; }
  .overdue { color: var(--danger); font-weight: 600; }
  li.done .title { text-decoration: line-through; opacity: .6; }
  .del-btn svg, .icon-btn svg { display: block; pointer-events: none; }
  #filterRow { display: flex; align-items: center; gap: 8px; }
  #count { color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
  <header>
    <span id="count"></span>
    <h1>To-Do</h1>
    <button type="button" id="theme" class="icon-btn"></button>
  </header>
  <form id="form">
    <div class="row">
      <input type="text" id="text" placeholder="What needs doing?" autocomplete="off">
      <button type="submit">Add</button>
    </div>
    <div class="row">
      <select id="category" title="Category"></select>
      <input type="date" id="due" title="Due date (optional)">
    </div>
  </form>

  <div id="filterRow">
    <label for="filter">Show:</label>
    <select id="filter"></select>
  </div>

  <ul id="list"></ul>

<script>
  const CATEGORIES = ["Work", "Personal", "Others"];

  // Map any stored/typed value onto the fixed list (case-insensitive); unknown -> Others.
  function normCat(c) {
    const key = String(c || "").trim().toLowerCase();
    return CATEGORIES.find(x => x.toLowerCase() === key) || "Others";
  }

  let todos = [];
  let editingId = null;
  let filter = "";   // "" = all categories
  try { todos = JSON.parse(localStorage.getItem("todos")) || []; } catch (e) {}
  todos.forEach(t => { t.category = normCat(t.category); });

  const list = document.getElementById("list");
  const count = document.getElementById("count");
  const input = document.getElementById("text");
  const catInput = document.getElementById("category");
  const dueInput = document.getElementById("due");
  const filterSel = document.getElementById("filter");
  const themeSel = document.getElementById("theme");

  const BIN_ICON =
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
    '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>';

  function save() {
    try { localStorage.setItem("todos", JSON.stringify(todos)); } catch (e) {}
  }

  // ---- Theme ----
  function applyTheme(mode) {
    if (mode === "light" || mode === "dark") {
      document.documentElement.setAttribute("data-theme", mode);
    } else {
      document.documentElement.removeAttribute("data-theme");
    }
  }

  const svg = path =>
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + path + '</svg>';
  const MOON_ICON = svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>');
  const SUN_ICON = svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>');

  function currentTheme() {
    return document.documentElement.getAttribute("data-theme") ||
      (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  }

  // Button shows the mode you would switch TO: moon while light, sun while dark.
  function updateThemeButton() {
    const dark = currentTheme() === "dark";
    themeSel.innerHTML = dark ? SUN_ICON : MOON_ICON;
    themeSel.title = dark ? "Switch to light mode" : "Switch to dark mode";
    themeSel.setAttribute("aria-label", themeSel.title);
  }

  let savedTheme = null;
  try { savedTheme = localStorage.getItem("theme"); } catch (e) {}
  applyTheme(savedTheme);   // no saved choice -> follow the system setting
  updateThemeButton();

  themeSel.addEventListener("click", () => {
    const next = currentTheme() === "dark" ? "light" : "dark";
    applyTheme(next);
    updateThemeButton();
    try { localStorage.setItem("theme", next); } catch (e) {}
  });

  // ---- Helpers ----
  function todayStr() {
    const d = new Date();
    const p = n => String(n).padStart(2, "0");
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
  }

  function el(tag, props) {
    return Object.assign(document.createElement(tag), props);
  }

  function categoryOptions() {
    return CATEGORIES.map(c => el("option", { value: c, textContent: c }));
  }

  // Static dropdowns, filled once
  catInput.replaceChildren(...categoryOptions());
  catInput.value = "Others";
  filterSel.replaceChildren(
    el("option", { value: "", textContent: "All categories" }),
    ...categoryOptions()
  );

  // ---- Rendering ----
  function render() {
    list.innerHTML = "";
    const today = todayStr();
    const visible = todos.filter(t => !filter || t.category === filter);

    for (const t of visible) {
      const li = el("li");
      li.dataset.id = t.id;
      if (t.done) li.className = "done";

      const box = el("input", { type: "checkbox", checked: t.done });
      const main = el("div", { className: "main" });
      let focusEl = null;

      if (t.id === editingId) {
        main.className = "main editing";
        focusEl = el("input", { type: "text", className: "edit", value: t.text });
        const cat = el("select", { className: "edit" });
        cat.replaceChildren(...categoryOptions());
        cat.value = t.category;
        const due = el("input", { type: "date", className: "edit", value: t.due || "" });
        main.append(focusEl, cat, due);
      } else {
        main.append(el("span", { className: "title", textContent: t.text }));
        const meta = el("div", { className: "meta" });
        meta.append(el("span", { className: "cat", textContent: t.category }));
        if (t.due) {
          const overdue = !t.done && t.due < today;
          meta.append(el("span", {
            className: overdue ? "overdue" : "",
            textContent: (overdue ? "Overdue: " : "Due: ") + t.due
          }));
        }
        main.append(meta);
      }

      const edit = el("button", { textContent: "✎", title: "Edit", className: "edit-btn" });
      const del = el("button", { innerHTML: BIN_ICON, title: "Delete", className: "del-btn" });

      li.append(box, main, edit, del);
      list.append(li);
      if (focusEl) { focusEl.focus(); focusEl.select(); }
    }

    const left = visible.filter(t => !t.done).length;
    count.textContent = left + (left === 1 ? " item left" : " items left");
  }

  // ---- Events ----
  document.getElementById("form").addEventListener("submit", e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    todos.push({
      id: Date.now() + Math.random(),
      text,
      category: normCat(catInput.value),
      due: dueInput.value,
      done: false
    });
    input.value = "";
    dueInput.value = "";
    save(); render();
  });

  filterSel.addEventListener("change", () => {
    filter = filterSel.value;
    render();
  });

  list.addEventListener("click", e => {
    const li = e.target.closest("li");
    if (!li) return;
    const id = Number(li.dataset.id);
    if (e.target.className === "edit-btn") {
      editingId = id;
      render();
      return;
    } else if (e.target.tagName === "BUTTON") {
      todos = todos.filter(t => t.id !== id);
    } else if (e.target.type === "checkbox") {
      const t = todos.find(t => t.id === id);
      t.done = e.target.checked;
    } else return;
    save(); render();
  });

  function finishEdit(commit) {
    if (editingId === null) return;
    const t = todos.find(t => t.id === editingId);
    const [text, cat, due] = list.querySelectorAll(".editing .edit");
    if (commit && t && text.value.trim()) {
      t.text = text.value.trim();
      t.category = normCat(cat.value);
      t.due = due.value;
    }
    editingId = null;
    save(); render();
  }

  list.addEventListener("keydown", e => {
    if (!e.target.classList.contains("edit")) return;
    if (e.key === "Enter") finishEdit(true);
    else if (e.key === "Escape") finishEdit(false);
  });

  // Save when focus leaves the edit fields entirely (not when moving between them)
  list.addEventListener("focusout", e => {
    if (!e.target.classList.contains("edit")) return;
    const next = e.relatedTarget;
    if (next && next.classList && next.classList.contains("edit")) return;
    finishEdit(true);
  });

  render();
</script>
</body>
</html>
